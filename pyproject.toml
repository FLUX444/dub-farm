[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dub-farm"
version = "0.1.0"
description = "Automatic video dubbing pipeline with context-aware translation and neural TTS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dub-farm" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "pydub>=0.25.1",
    "scenedetect>=0.6.4",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
# Full ML stack. Python 3.11–3.13 recommended (qwen-tts may not support 3.14).
ml = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "demucs>=4.0.1",
    "faster-whisper>=1.0.0",
    "qwen-tts>=0.1.1",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "huggingface_hub>=0.23.0",
]
# WhisperX adds word alignment + diarization (Python 3.11–3.13 only)
ml-whisperx = [
    "dub-farm[ml]",
    "whisperx>=3.1.1; python_version < '3.14'",
]

[project.scripts]
dub-farm = "dub_farm.cli:app"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["dub_farm"]

[tool.hatch.build.targets.sdist]
only-include = ["dub_farm", "config", "README.md"]
